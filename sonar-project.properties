# SonarQube project config — generated by initial bootstrap.
sonar.projectKey=brainbow
sonar.projectName=Brainbow
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/__pycache__/**,**/*.min.js,**/*.bundle.js,**/.venv/**,**/venv/**,**/target/**,**/.gradle/**,**/vendor/**

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/tests/**,**/__tests__/**,**/*_test.py,**/test_*.py

# Coverage — uncomment after CI generates these reports.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.python.coverage.reportPaths=coverage.xml
