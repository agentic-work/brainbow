# SPDX-License-Identifier: MIT

# Trivy — filesystem CVE scan. Fails the build if any Dockerfile/code
# reference a library with a known CRITICAL or HIGH severity CVE.
name: Trivy Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trivy:
    name: Trivy FS Scan
    runs-on: arc-${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        # v0.33.1 SHA; bare "0.28.0" 404s during action resolution
        # (tag namespace uses the `v` prefix).
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
