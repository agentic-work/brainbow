# SonarQube Code Analysis
# Triggers: push to main, PRs to main, manual dispatch.
# Runs on self-hosted ARC runners (k8s-backed, scale-to-zero, no GH-hosted minutes used).
name: SonarQube
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: arc-${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
